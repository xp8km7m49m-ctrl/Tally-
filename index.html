  function showBootError(title, detail) {
    var el = document.getElementById('boot-error');
    if (!el) {
      el = document.createElement('div');
      el.id = 'boot-error';
      el.style.cssText = 'position:fixed;inset:0;background:#263831;color:#F5F1E4;font-family:-apple-system,sans-serif;font-size:13px;line-height:1.5;padding:24px;overflow:auto;z-index:99999;white-space:pre-wrap;';
      document.body.appendChild(el);
    }
    el.textContent = title + '\n\n' + detail;
  }
  window.addEventListener('error', function (e) {
    showBootError(
      'Tally hit an error while loading:',
      (e.message || 'Unknown error') + '\nFile: ' + (e.filename || '?') + '\nLine: ' + (e.lineno || '?')
    );
  });
  window.addEventListener('unhandledrejection', function (e) {
    showBootError('Tally hit an error while loading:', String((e.reason && e.reason.message) || e.reason));
  });
</script>

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

.tally-app {
  --slate: #263831;
  --slate-2: #32463D;

}

  width: 100%;
  max-width: 440px;
  min-height: 100vh;
  background: var(--slate);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 60px rgba(0,0,0,0.35);
}

.loading-shell { align-items: center; justify-content: center; display: flex; }
.loading-word {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: var(--cream);
  opacity: 0.6;
  animation: pulse 1.4s ease-in-out infinite;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 20px 18px 14px;
}
.wordmark {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 700;
  font-size: 26px;
  color: var(--cream);
  letter-spacing: 0.5px;
}
.tagline {
  font-size: 12px;
  color: var(--cream-soft);
  margin-top: 2px;
}

.setup-banner {
  background: #E8A33D;
  color: #1C2A24;
  font-size: 12px;
  font-weight: 600;

}
.avatar-strip {

  align-items: center;
  gap: 4px;
  background: var(--slate-2);
  border: none;
  border-radius: 999px;
  padding: 5px 8px;
  cursor: pointer;
}
.avatar-chip {
  width: 26px;
  height: 26px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: center;

.avatar-strip-icon {
  color: var(--cream-soft);
  display: flex;
  align-items: center;
  margin-left: 6px;
}

.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 8px 16px 90px;
}

.view-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin: 10px 0 14px;
}
.view-title {
  font-family: 'Baloo 2', sans-serif;
  font-weight: 600;
  font-size: 21px;
  color: var(--cream);
  margin: 0;
}
.view-subtitle {
  font-size: 12.5px;
  color: var(--cream-soft);
  margin: 3px 0 0;
}

  background: var(--slate-2);
  color: var(--cream);
  width: 36px;
  height: 36px;

  align-items: center;
  justify-content: center;

  color: var(--ink-soft);

  padding: 4px;
  display: flex;
  flex-shrink: 0;
}

.mini-tally-list { display: flex; flex-direction: column; gap: 7px; }
.mini-tally-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mini-tally-name { font-size: 13px; color: var(--ink); min-width: 84px; }

.chip {
  font-size: 11px;
  background: var(--paper-dim);
  color: var(--ink-soft);
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
}

.week-nav { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
.day-strip { display: flex; flex: 1; justify-content: space-between; gap: 3px; }
.day-pill {
  flex: 1;
  border: none;
  background: var(--slate-2);
  color: var(--cream-soft);
  border-radius: 12px;
  padding: 7px 2px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.day-pill-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
.day-pill-num { font-size: 14px; font-weight: 600; }
.day-pill.today .day-pill-num { color: #E8A33D; }
.day-pill.active { background: #E8A33D; color: var(--slate-3); }
.day-pill.active .day-pill-num { color: var(--slate-3); }

.segmented {
  display: flex;
  background: var(--slate-2);
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 12px;
}
.segmented button {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--cream-soft);
  padding: 7px 0;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.segmented button.active { background: var(--paper); color: var(--ink); }

.insight-line {
  font-size: 13px;
  color: var(--ink);
  background: var(--paper-dim);
  padding: 9px 11px;
  border-radius: 12px;
  margin: 0 0 12px;
}
.tally-list-row { padding-bottom: 4px; }
.tally-list-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
.tally-list-name { font-size: 14px; font-weight: 600; color: var(--ink); }
.tally-list-stat { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); }

.tally-row, .mini-tally-row .tally-row { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tally-empty { font-size: 12px; color: var(--ink-soft); font-style: italic; }
.tally-group { position: relative; display: inline-flex; align-items: flex-end; margin-right: 2px; height: 16px; }
.tally-stroke { width: 3px; height: 15px; display: inline-block; margin-right: 2px; border-radius: 1px; }
.tally-diagonal { position: absolute; width: 20px; height: 3px; top: 6px; left: -1px; transform: rotate(-30deg); border-radius: 1px; }

.add-inline { display: flex; gap: 8px; margin-bottom: 12px; }
.input {
  font-family: 'Inter', sans-serif;
  background: var(--paper);
  border: 1.5px solid transparent;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--ink);
  width: 100%;
  box-sizing: border-box;
}
.input:focus-visible { outline: none; border-color: #E8A33D; }
.textarea { resize: vertical; font-family: 'Inter', sans-serif; }

.btn-primary {
  background: #E8A33D;
  color: var(--slate-3);
  border: none;
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  flex-shrink: 0;
  font-family: 'Inter', sans-serif;
}
.btn-primary:focus-visible { outline: 2px solid var(--cream); outline-offset: 2px; }
.btn-full { width: 100%; margin-top: 6px; }

.btn-ghost {
  background: var(--paper-dim);
  color: var(--ink);
  border: none;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 12.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}

.text-link {
  background: none;
  border: none;
  color: var(--ink-soft);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0;
}
.text-link.danger { color: var(--danger); }

.meal-list { gap: 12px; }
.meal-card { background: var(--paper); border-radius: 18px; padding: 14px; }
.meal-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
.meal-date { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-bottom: 2px; }
.meal-name { font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 16px; color: var(--ink); }
.meal-ingredients { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.meal-send { margin-top: 4px; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(20, 28, 22, 0.55);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}
.modal-panel {
  background: var(--slate);
  width: 100%;
  max-width: 440px;
  border-radius: 22px 22px 0 0;
  padding: 18px 18px 26px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slide-up 0.22s ease-out;
}
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-head h3 { font-family: 'Baloo 2', sans-serif; color: var(--cream); font-size: 18px; margin: 0; }
.modal-form { display: flex; flex-direction: column; gap: 4px; }
.field-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--cream-soft); margin: 10px 0 5px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.member-picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.member-picker-btn {
  border: 2px solid;
  background: var(--slate-2);
  color: var(--cream);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  opacity: 0.55;
  font-family: 'Inter', sans-serif;
}
.member-picker-btn.active { opacity: 1; }
.member-picker-emoji { font-size: 15px; }

.member-list { margin-bottom: 16px; }
.member-list-row { display: flex; align-items: center; gap: 8px; color: var(--cream); font-size: 14px; }
.member-list-emoji { font-size: 15px; }
.member-list-name { flex: 1; font-weight: 500; }

.emoji-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.emoji-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  border: none;
  background: var(--slate-2);
  font-size: 17px;
  cursor: pointer;
  opacity: 0.55;
}
.emoji-btn.active { opacity: 1; outline: 2px solid #E8A33D; }

.color-picker { display: flex; gap: 8px; margin: 8px 0 4px; }
.color-btn { width: 28px; height: 28px; border-radius: 999px; border: none; cursor: pointer; opacity: 0.55; }
.color-btn.active { opacity: 1; outline: 2px solid var(--cream); outline-offset: 2px; }

.reset-row { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }

.money-glance-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink); padding: 3px 0; }
.money-glance-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

.money-picture .money-stats { display: flex; justify-content: space-between; margin-bottom: 14px; }
.money-stat { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.money-stat-label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.4px; }
.money-stat-value { font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 600; color: var(--ink); }

.budget-cat-row { padding-bottom: 2px; }
.budget-cat-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.budget-cat-name { flex: 1; font-size: 13.5px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.budget-cat-amt { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
.budget-bar-track { height: 7px; background: var(--paper-dim); border-radius: 999px; overflow: hidden; }
.budget-bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
.budget-over-note { font-size: 11px; color: var(--danger); margin-top: 3px; font-weight: 600; }

.pot-card { text-align: center; padding: 22px 16px 16px; }
.pot-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--ink-soft); font-weight: 600; }
.pot-total { font-family: 'Baloo 2', sans-serif; font-size: 34px; font-weight: 700; color: var(--ink); margin: 4px 0 2px; }
.pot-breakdown { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 14px; }
.pot-actions { display: flex; gap: 8px; justify-content: center; }
.pot-actions .btn-primary, .pot-actions .btn-ghost { flex: 0 0 auto; }
.pot-log { margin-top: 16px; text-align: left; border-top: 1px solid rgba(36,49,43,0.1); padding-top: 12px; }
.pot-log-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink); }

.goals-head { margin: 4px 0 10px; }
.goals-label { margin-bottom: 0; }
.goal-list { gap: 10px; }
.goal-card { margin-bottom: 0; }
.goal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.goal-name { font-family: 'Baloo 2', sans-serif; font-weight: 600; font-size: 15px; color: var(--ink); }
.goal-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; }
.goal-amt { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
.goal-reached { font-size: 12px; font-weight: 600; color: var(--success); }

.toast {
  position: absolute;
  bottom: 76px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--slate-3);
  color: var(--cream);
  font-size: 13px;
  font-weight: 500;
  padding: 9px 16px;
  border-radius: 999px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  z-index: 40;
  animation: toast-in 0.2s ease-out;
}

.nav-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  background: var(--slate-2);
  padding: 8px 4px calc(env(safe-area-inset-bottom, 0px) + 8px);
  border-top: 1px solid rgba(255,255,255,0.06);
}
.nav-btn {
  flex: 1;
  border: none;
  background: none;
  color: var(--cream-soft);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 0;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.nav-btn.active { color: #E8A33D; }
.nav-label { font-size: 10.5px; font-weight: 600; }
.nav-icon-wrap { position: relative; display: flex; }
.badge-dot { position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; border-radius: 999px; background: var(--danger); }
.badge-count {
  position: absolute; top: -6px; right: -10px;
  background: #E8A33D; color: var(--slate-3);
  font-size: 9px; font-weight: 700;
  min-width: 15px; height: 15px;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  padding: 0 3px;
  font-family: 'IBM Plex Mono', monospace;
}

@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
@keyframes slide-up { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes toast-in { from { transform: translate(-50%, 8px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
@keyframes view-fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.view-enter { animation: view-fade 0.18s ease-out; }

@media (prefers-reduced-motion: reduce) {
  *, .checkbox, .modal-panel, .toast, .view-enter, .loading-word { animation: none !important; transition: none !important; }
}
